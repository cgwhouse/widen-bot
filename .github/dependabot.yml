version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "daily"
    groups:
      lavalink4net:
        patterns:
          - "Lavalink4NET*"
      msftextensions:
        patterns:
          - "Microsoft.Extensions*"

  - package-ecosystem: "docker"
    directory: "/src"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
