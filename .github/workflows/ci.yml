name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: Build C# client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore src/WidenBot.csproj
      - run: dotnet build src/WidenBot.csproj -c Release --no-restore

  python:
    name: Lint orchestrator script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install ruff
        run: pip install ruff
      - run: ruff check widenbot
      - run: ruff format --check widenbot
      - name: Validate config schema is valid JSON
        run: python -c "import json; json.load(open('config.schema.json'))"

  docker:
    name: Build client image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f src/Dockerfile src
