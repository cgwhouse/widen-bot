services:
  widenbot-server:
    container_name: ${INSTANCE_LABEL}-widenbot-server
    image: ghcr.io/lavalink-devs/lavalink:4-distroless
    restart: unless-stopped
    networks:
      - widenbot-net
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
      - ./plugins/:/opt/Lavalink/plugins/
    expose:
      - 2333
    environment:
      - _JAVA_OPTIONS=-Xmx${LAVALINK_MAX_MEMORY:?maxMemory is required in config.json}
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${WIDENBOT_PASSWORD}
  widenbot-client:
    depends_on:
      - widenbot-server
    container_name: ${INSTANCE_LABEL}-widenbot-client
    image: ghcr.io/cgwhouse/widen-bot:latest
    build: .
    restart: unless-stopped
    networks:
      - widenbot-net
    ports:
      - ${CLIENT_PORT}:${CLIENT_PORT}
    environment:
      - INSTANCE_LABEL=${INSTANCE_LABEL}
      - WIDENBOT_PASSWORD=${WIDENBOT_PASSWORD}
      - DISCORD_SERVER_ID=${DISCORD_SERVER_ID}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - SPOTIFY_ENABLED=${SPOTIFY_ENABLED}
      - REQUIRED_CHANNEL=${REQUIRED_CHANNEL}

networks:
  widenbot-net:
    name: ${INSTANCE_LABEL}-widenbot-net
